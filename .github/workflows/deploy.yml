name: Build, test, and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Deploy on-prem
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # The real secrets (.env with GITHUB_TOKEN, GITHUB_WEBHOOK_SECRET,
      # LLM_* config) never go through this repo or GitHub's servers. They
      # live only on this runner's machine, outside the git checkout, and
      # get copied into the workspace right before `docker compose up`.
      # One-time setup on the runner host (PowerShell, as Administrator):
      #   New-Item -ItemType Directory -Force -Path C:\code-review-agent-secrets
      #   Copy-Item .env.example C:\code-review-agent-secrets\.env
      #   notepad C:\code-review-agent-secrets\.env   # fill in real values
      - name: Stage runtime secrets
        shell: powershell
        run: Copy-Item "C:\code-review-agent-secrets\.env" ".env" -Force

      - name: Build and restart containers
        shell: powershell
        run: docker compose up -d --build --remove-orphans

      - name: Wait for health check
        shell: powershell
        run: |
          $port = if ($env:PORT) { $env:PORT } else { "3000" }
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://localhost:$port/healthz" -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) {
                Write-Host "service healthy"
                exit 0
              }
            } catch {}
            Start-Sleep -Seconds 2
          }
          Write-Error "service did not become healthy in time"
          docker compose logs --tail=100 app
          exit 1

      - name: Prune old images
        if: always()
        shell: powershell
        run: docker image prune -f
